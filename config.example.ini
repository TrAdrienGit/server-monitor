# Copier en config.ini (non versionné) et adapter.

[deploy]
# Cible SSH utilisée par scripts/deploy.sh
ssh_target = root@100.x.y.z

[monitor]
# IP d'écoute : laisser vide pour prendre l'IP Tailscale automatiquement (tailscale ip -4)
host =
port = 9110
db = /var/lib/server-monitor/history.db
sample_seconds = 60
retention_days = 30

# ComfyUI (génération d'images) : service systemd UTILISATEUR piloté depuis la page (état / allumer / éteindre)
comfyui_user = utilisateur-linux
comfyui_unit = comfyui.service
comfyui_port = 8188

# Serveur Minecraft (Cobblemon Academy) : service systemd UTILISATEUR piloté depuis la page (état / allumer / éteindre)
minecraft_user = utilisateur-linux
minecraft_unit = minecraft.service
minecraft_port = 25565
